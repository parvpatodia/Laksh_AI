name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests scripts

      - name: Mypy (app/pose)
        run: mypy app/pose

      - name: Pose landmarker model (repo root)
        run: python scripts/download_pose_model.py

      - name: Pose eval readiness (strict)
        run: python scripts/check_pose_eval_readiness.py --manifest evaluation/gym_manifest.csv --strict

      - name: Run tests
        run: pytest tests/ -q
