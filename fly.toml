# fly.toml — Laksh.ai API backend (Fly.io)
#
# Machine spec: shared-cpu-1x, 1 GB RAM (~$5/mo always-on).
# Always-on: min_machines_running=1, auto_stop_machines="off".
# Single region: iad (US East / Ashburn) -- lowest latency to Northeastern.
#
# Before first deploy:
#   fly apps create laksh-api              (one-time)
#   fly secrets set \
#     R2_ACCOUNT_ID=<hex> \
#     R2_ACCESS_KEY=<key> \
#     R2_SECRET=<secret> \
#     R2_BUCKET=laksh-clips \
#     GOOGLE_API_KEY=<key> \
#     GEMINI_API_KEY=<key>
#   fly volumes create laksh_chroma --region iad --size 1
#   fly deploy

app = "laksh-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret runtime config. Secrets (R2_*, API keys) set via `fly secrets set`.
  PORT = "8000"
  LAKSH_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/v1/health"
  protocol = "http"
  timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[mounts]]
  source = "laksh_chroma"
  destination = "/app/chroma_db"
  processes = ["app"]
